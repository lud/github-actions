name: Run Dialyzer
description: >
  Restores the Dialyzer PLT from cache, builds or updates it if needed, saves
  the PLT cache, then runs mix dialyzer. The cache is saved before the analysis
  runs, so the PLT is available on the next run even when dialyzer reports
  warnings. This can save a lot of time because PLT generation can take
  several minutes.

inputs:
  otp-version:
    description: Erlang/OTP version, typically from the outputs of setup-beam.
    required: true
  elixir-version:
    description: Elixir version, typically from the outputs of setup-beam.
    required: true
  cache-version:
    description: Cache key prefix. Bump this to invalidate the cache.
    required: false
    default: "v1"
  plt-dir:
    description: Directory where Dialyzer stores PLT files.
    required: false
    default: "_build/plts"

runs:
  using: composite
  steps:
    - name: Restore PLT cache
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.plt-dir }}
        key: ${{ inputs.cache-version }}-dialyzer-plts-${{ runner.os }}--${{ inputs.otp-version }}--${{ inputs.elixir-version }}--${{ hashFiles('mix.exs', 'mix.lock') }}
        restore-keys: |
          ${{ inputs.cache-version }}-dialyzer-plts-${{ runner.os }}--${{ inputs.otp-version }}--${{ inputs.elixir-version }}--
          ${{ inputs.cache-version }}-dialyzer-plts-${{ runner.os }}--${{ inputs.otp-version }}--

    - name: Build PLT
      shell: bash
      run: mix dialyzer --plt

    - name: Save PLT cache
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.plt-dir }}
        key: ${{ inputs.cache-version }}-dialyzer-plts-${{ runner.os }}--${{ inputs.otp-version }}--${{ inputs.elixir-version }}--${{ hashFiles('mix.exs', 'mix.lock') }}

    - name: Run dialyzer
      shell: bash
      run: mix dialyzer --no-check --halt-exit-status
